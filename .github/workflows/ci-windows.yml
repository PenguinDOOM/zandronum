name: Windows build

on: [push, pull_request]

env:
    OPENAL_COMMIT: b2c48f7718ef3fcf67921a8b6534c4914e328970
    ZSTD_COMMIT: f8745da6ff1ad1e7bab384bd1f9d742439278e99

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false

      matrix:
        build_type: [Release]
        platform: ["Win32", "x64"]

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "deps-dir=${{ github.workspace }}/deps" >> "$GITHUB_OUTPUT"

    - name: Install dependencies for Windows
      shell: pwsh
      if: runner.os == 'Windows'
      run: |
        Invoke-WebRequest -Outfile 'deps.zip' 'https://github.com/DrinkyBird/zan-ci-deps/releases/download/ci-dependencies/zan-windows-deps.zip'
        Expand-Archive 'deps.zip' -DestinationPath '${{ steps.strings.outputs.deps-dir }}'

    - name: Build pinned OpenAL Soft
      shell: pwsh
      run: |
        $openalSource = '${{ github.workspace }}\openal-soft'
        $openalBuild = '${{ github.workspace }}\openal-soft-build-${{ matrix.platform }}'
        $openalRoot = '${{ github.workspace }}\openal-soft-install-${{ matrix.platform }}'
        git clone https://github.com/kcat/openal-soft.git $openalSource
        git -C $openalSource checkout $env:OPENAL_COMMIT
        & cmake -S $openalSource -B $openalBuild -A '${{ matrix.platform }}' `
            "-DCMAKE_INSTALL_PREFIX=$openalRoot" `
            -DALSOFT_UTILS=OFF `
            -DALSOFT_EXAMPLES=OFF
        & cmake --build $openalBuild --config '${{ matrix.build_type }}'
        & cmake --install $openalBuild --config '${{ matrix.build_type }}'
        $openalHeader = Join-Path $openalRoot 'include\AL\al.h'
        $openalLibrary = Join-Path $openalRoot 'lib\OpenAL32.lib'
        if (!(Test-Path -LiteralPath $openalHeader -PathType Leaf) -or
            !(Test-Path -LiteralPath $openalLibrary -PathType Leaf)) {
            throw "Pinned OpenAL Soft install for ${{ matrix.platform }} must contain include\AL\al.h and lib\OpenAL32.lib."
        }
        echo "OPENAL_INCLUDE_DIR=$openalRoot\include" >> $env:GITHUB_ENV
        echo "OPENAL_LIBRARY=$openalRoot\lib\OpenAL32.lib" >> $env:GITHUB_ENV

    - name: Configure CMake
      shell: pwsh
      run: |
        $bits = 32;
        $sslArch = 'x86';
        $fmodArch = '';
        If ( '${{ matrix.platform }}' -eq 'x64' ) {
            $bits = 64;
            $sslArch = 'x64';
            $fmodArch = '64';
        }
        
        # see src/CMakeLists.txt, it takes an env variable hint for finding DirectX
        $env:DXSDK_DIR = "${{ steps.strings.outputs.deps-dir }}\dxsdk" ;

        $zstdSource = '${{ github.workspace }}\zstd'
        $zstdBuild = '${{ github.workspace }}\zstd-build-${{ matrix.platform }}'
        $zstdRoot = '${{ github.workspace }}\zstd-install-${{ matrix.platform }}'
        git clone https://github.com/facebook/zstd.git $zstdSource
        git -C $zstdSource checkout $env:ZSTD_COMMIT
        & cmake -S "$zstdSource\build\cmake" -B $zstdBuild -A '${{ matrix.platform }}' `
            "-DCMAKE_INSTALL_PREFIX=$zstdRoot" `
            -DZSTD_BUILD_SHARED=OFF `
            -DZSTD_BUILD_PROGRAMS=OFF `
            -DZSTD_BUILD_TESTS=OFF `
            -DZSTD_BUILD_CONTRIB=OFF
        & cmake --build $zstdBuild --config '${{ matrix.build_type }}'
        & cmake --install $zstdBuild --config '${{ matrix.build_type }}'
        $zstdInclude = Join-Path $zstdRoot 'include'
        $zstdHeader = Join-Path $zstdInclude 'zstd.h'
        $zstdLibrary = Join-Path $zstdRoot 'lib\zstd_static.lib'
        if (!(Test-Path -LiteralPath $zstdHeader -PathType Leaf) -or
            !(Test-Path -LiteralPath $zstdLibrary -PathType Leaf)) {
            throw "Pinned ZStd install for ${{ matrix.platform }} must contain include\zstd.h and lib\zstd_static.lib."
        }
        
        # We need it for the artefacts later
        echo "FMOD_DLL=${{ steps.strings.outputs.deps-dir }}\fmod\api\fmodex${fmodArch}.dll" >> $env:GITHUB_ENV ;
        
        & cmake -B "${{ steps.strings.outputs.build-output-dir }}" -S "${{ github.workspace }}" `
            -A "${{ matrix.platform }}" `
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" `
            -DRELEASE_WITH_DEBUG_FILE=ON `
            -DOPUS_INCLUDE_DIR="${{ steps.strings.outputs.deps-dir }}\opus\include" `
            -DOPUS_LIBRARIES="${{ steps.strings.outputs.deps-dir }}\opus\lib${bits}\opus.lib" `
            -DOPENSSL_INCLUDE_DIR="${{ steps.strings.outputs.deps-dir }}\openssl${bits}\include" `
            -DLIB_EAY_DEBUG="${{ steps.strings.outputs.deps-dir }}\openssl${bits}\lib\VC\${sslArch}\MTd\libcrypto_static.lib" `
            -DLIB_EAY_RELEASE="${{ steps.strings.outputs.deps-dir }}\openssl${bits}\lib\VC\${sslArch}\MT\libcrypto_static.lib" `
            -DSSL_EAY_DEBUG="${{ steps.strings.outputs.deps-dir }}\openssl${bits}\lib\VC\${sslArch}\MTd\libssl_static.lib" `
            -DSSL_EAY_RELEASE="${{ steps.strings.outputs.deps-dir }}\openssl${bits}\lib\VC\${sslArch}\MT\libssl_static.lib" `
            -DFMOD_INCLUDE_DIR="${{ steps.strings.outputs.deps-dir }}\fmod\api\inc" `
            -DFMOD_LIBRARY="${{ steps.strings.outputs.deps-dir }}\fmod\api\lib\fmodex${fmodArch}_vc.lib" `
            -DZSTD_INCLUDE_DIR="$zstdInclude" `
            -DZSTD_LIBRARY="$zstdLibrary" `
            -DOPENAL_INCLUDE_DIR="${env:OPENAL_INCLUDE_DIR}" `
            -DOPENAL_LIBRARY="${env:OPENAL_LIBRARY}" `
            -DNASM_PATH="${{ steps.strings.outputs.deps-dir }}\nasm\nasm.exe"

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Create package
      shell: pwsh
      run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'package'
          $buildOutput = '${{ steps.strings.outputs.build-output-dir }}\${{ matrix.build_type }}'
          $openalSource = '${{ github.workspace }}\openal-soft'
          $openalRoot = '${{ github.workspace }}\openal-soft-install-${{ matrix.platform }}'
          if (Test-Path -LiteralPath $package) {
              Remove-Item -LiteralPath $package -Recurse -Force
          }
          New-Item -ItemType Directory -Path $package | Out-Null

          $expectedExecutables = @(Get-ChildItem -LiteralPath $buildOutput -File -Filter '*.exe' | Sort-Object Name)
          $expectedPk3s = @(Get-ChildItem -LiteralPath $buildOutput -File -Filter '*.pk3' | Sort-Object Name)
          if ($expectedExecutables.Count -eq 0 -or $expectedPk3s.Count -eq 0) {
              throw 'The build output must contain at least one executable and one PK3.'
          }
          Copy-Item -LiteralPath $expectedExecutables.FullName -Destination $package
          Copy-Item -LiteralPath (Get-ChildItem -LiteralPath $buildOutput -File -Filter '*.pdb').FullName -Destination $package
          Copy-Item -LiteralPath $expectedPk3s.FullName -Destination $package

          if ([string]::IsNullOrWhiteSpace($env:FMOD_DLL) -or !(Test-Path -LiteralPath $env:FMOD_DLL -PathType Leaf)) {
              throw 'FMOD_DLL must name the configured FMOD runtime file.'
          }
          $fmodName = Split-Path -Leaf $env:FMOD_DLL
          $expectedFmodName = if ('${{ matrix.platform }}' -eq 'x64') { 'fmodex64.dll' } else { 'fmodex.dll' }
          if ($fmodName -cne $expectedFmodName) {
              throw "FMOD_DLL must name $expectedFmodName for this package."
          }
          Copy-Item -LiteralPath $env:FMOD_DLL -Destination (Join-Path $package $fmodName)

          $openalRuntimeCandidates = @(Get-ChildItem -LiteralPath (Join-Path $openalRoot 'bin') -File -Filter 'soft_oal.dll')
          if ($openalRuntimeCandidates.Count -ne 1) {
              throw "Expected exactly one pinned OpenAL Soft runtime at $openalRoot\bin\soft_oal.dll."
          }
          if ($env:OPENAL_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'OPENAL_COMMIT must be a full pinned commit SHA.'
          }
          $openalRuntimeHash = (Get-FileHash -LiteralPath $openalRuntimeCandidates[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item -LiteralPath $openalRuntimeCandidates[0].FullName -Destination (Join-Path $package 'OpenAL32.dll')
          $packagedOpenalHash = (Get-FileHash -LiteralPath (Join-Path $package 'OpenAL32.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packagedOpenalHash -cne $openalRuntimeHash) {
              throw 'The packaged OpenAL32.dll does not match the pinned OpenAL Soft runtime.'
          }

          $openalLicense = Join-Path $openalSource 'COPYING'
          if (!(Test-Path -LiteralPath $openalLicense -PathType Leaf)) {
              throw "Pinned OpenAL Soft source is missing COPYING: $openalLicense"
          }
          Copy-Item -LiteralPath $openalLicense -Destination (Join-Path $package 'OpenAL-Soft-COPYING.txt')
          $sourceNotice = @(
              'OpenAL Soft source location'
              'Repository: https://github.com/kcat/openal-soft'
              "Commit: $env:OPENAL_COMMIT"
              'License: LGPL-2.0-or-later (see OpenAL-Soft-COPYING.txt)'
          ) -join [Environment]::NewLine
          Set-Content -LiteralPath (Join-Path $package 'OpenAL-Soft-SOURCE.txt') -Value $sourceNotice -Encoding utf8 -NoNewline

          $fmodRuntimes = @(Get-ChildItem -LiteralPath $package -File | Where-Object { $_.Name -like 'fmodex*.dll' } | Sort-Object Name)
          if ($fmodRuntimes.Count -ne 1 -or $fmodRuntimes[0].Name -cne $fmodName) {
              throw "Expected exactly the configured FMOD runtime $fmodName in the package."
          }
          $openalRuntimes = @(Get-ChildItem -LiteralPath $package -File | Where-Object { $_.Name -in @('OpenAL32.dll', 'soft_oal.dll') })
          if ($openalRuntimes.Count -ne 1 -or $openalRuntimes[0].Name -cne 'OpenAL32.dll') {
              throw 'The package must contain exactly one OpenAL32.dll runtime and no substituted soft_oal.dll.'
          }

          $packagedExecutables = @(Get-ChildItem -LiteralPath $package -File -Filter '*.exe' | Sort-Object Name)
          $packagedPk3s = @(Get-ChildItem -LiteralPath $package -File -Filter '*.pk3' | Sort-Object Name)
          if (($packagedExecutables.Name -join '|') -cne ($expectedExecutables.Name -join '|') -or
              ($packagedPk3s.Name -join '|') -cne ($expectedPk3s.Name -join '|')) {
              throw 'The package executable or PK3 set differs from the build output set.'
          }

          $requiredOpenALLicenseNoticeNames = @(
              'OpenAL-Soft-COPYING.txt'
              'OpenAL-Soft-SOURCE.txt'
          )
          function Get-ExactOpenALLicenseNoticeFiles {
              param(
                  [string]$Directory,
                  [string[]]$ExpectedNames
              )
              $actualFiles = @(Get-ChildItem -LiteralPath $Directory -File -Filter 'OpenAL-Soft-*.txt' | Sort-Object Name)
              if (($actualFiles.Name -join '|') -cne ($ExpectedNames -join '|')) {
                  $actualNames = if ($actualFiles.Count -eq 0) { '<none>' } else { $actualFiles.Name -join ', ' }
                  throw "OpenAL Soft license/notice files must be exactly: $($ExpectedNames -join ', '). Actual: $actualNames"
              }
              return $actualFiles
          }

          $fixture = Join-Path $env:RUNNER_TEMP 'openal-license-notice-fixture'
          if (Test-Path -LiteralPath $fixture) {
              throw "OpenAL license/notice fixture path already exists: $fixture"
          }
          try {
              New-Item -ItemType Directory -Path $fixture | Out-Null
              foreach ($name in $requiredOpenALLicenseNoticeNames) {
                  Set-Content -LiteralPath (Join-Path $fixture $name) -Value 'fixture' -Encoding utf8 -NoNewline
              }
              Set-Content -LiteralPath (Join-Path $fixture 'OpenAL-Soft-EXTRA.txt') -Value 'fixture' -Encoding utf8 -NoNewline
              $fixtureError = $null
              try {
                  Get-ExactOpenALLicenseNoticeFiles -Directory $fixture -ExpectedNames $requiredOpenALLicenseNoticeNames | Out-Null
              } catch {
                  $fixtureError = $_.Exception.Message
              }
              if ([string]::IsNullOrWhiteSpace($fixtureError)) {
                  throw 'The OpenAL license/notice validation fixture accepted an unexpected extra file.'
              }
          } finally {
              if (Test-Path -LiteralPath $fixture) {
                  Remove-Item -LiteralPath $fixture -Recurse -Force
              }
          }

          $packagedLicenseNotice = @(Get-ExactOpenALLicenseNoticeFiles -Directory $package -ExpectedNames $requiredOpenALLicenseNoticeNames)

          function Get-ManifestRecord {
              param([System.IO.FileInfo]$File)
              [ordered]@{
                  path = $File.Name
                  sha256 = (Get-FileHash -LiteralPath $File.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
          }

          $manifest = [ordered]@{
              schema = 'phase1a-runtime-manifest'
              schema_version = 1
              vcs = [ordered]@{ commit = '${{ github.sha }}' }
              ci = [ordered]@{
                  provider = 'github'
                  run = '${{ github.run_id }}'
                  job = '${{ github.job }}'
              }
              platform = [ordered]@{
                  os = 'windows'
                  arch = if ('${{ matrix.platform }}' -eq 'x64') { 'x64' } else { 'x86' }
              }
              sound_enabled = $true
              openal = [ordered]@{
                  source_commit = $env:OPENAL_COMMIT
                  resolved_package_version = $null
              }
              files = [ordered]@{
                  executables = @($packagedExecutables | ForEach-Object { Get-ManifestRecord $_ })
                  fmod_runtime = @(Get-ManifestRecord $fmodRuntimes[0])
                  openal_runtime = @(Get-ManifestRecord $openalRuntimes[0])
                  pk3s = @($packagedPk3s | ForEach-Object { Get-ManifestRecord $_ })
                  license_notice = @($packagedLicenseNotice | ForEach-Object { Get-ManifestRecord $_ })
              }
          }
          foreach ($value in @('${{ github.sha }}', '${{ github.run_id }}', '${{ github.job }}', $env:OPENAL_COMMIT)) {
              if ([string]::IsNullOrWhiteSpace($value)) {
                  throw 'The package provenance metadata is incomplete.'
              }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $package 'phase1a-runtime-manifest.json') -Encoding utf8

    - name: Upload artefacts
      uses: actions/upload-artifact@v4
      with:
        path: package
        name: ${{ matrix.platform }} ${{ matrix.build_type }}
